<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Marquee v13.5 – Dashed Guides Everywhere</title>

    <style data-label="UNIVERSAL_MARQUEE_CORE_STYLES">
      :root {
        --um-duration-default: 15s;
        --um-gap-default: 2rem;
        --um-color-primary: #1f2937;
        --um-color-separator: #9ca3af;
        --um-font-size: 1.25rem;
        --um-font-weight: bold;
      }

      .um-container {
        display: flex;
        overflow: hidden;
        user-select: none;
        width: 100%;

        --um-duration: var(--um-duration-default);
        --um-gap: var(--um-gap-default);
      }

      .um-track {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 0;
        will-change: transform;
        padding-left: 0;
        padding-right: 0;
      }

      .um-track > div {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 0;
        flex-shrink: 0;

        padding-left: 10px;
      }

      .um-track > div > * {
        font-size: var(--um-font-size);
        font-weight: var(--um-font-weight);
        color: var(--um-color-separator);
        flex-shrink: 0;
        white-space: nowrap;
        display: flex;
        align-items: center;
        margin: 0;
        padding: 0;
        max-height: 1.5em;
        width: auto;
        object-fit: contain;
      }

      @media (prefers-reduced-motion: reduce) {
        .um-track {
          animation: none !important;
        }
      }
    </style>

    <style data-label="DEMO_PRESENTATION_STYLES">
      :root {
        --color-bg-page: #f9fafb;
        --color-text-primary: #111827;
        --color-accent-red: #dc2626;
        --color-text-secondary: #d1d5db;
        --color-container-bg: #111827;

        --color-guide-border: #e5e7eb; /* Warna garis guide yang jelas */
        --layout-guide-width: 1px;
        --layout-guide-style: dashed; /* <--- PERUBAHAN UTAMA */

        --layout-max-width: 1100px;
        --layout-content-padding: 30px;
        --layout-vertical-padding: 3rem;
        --layout-footer-height: 3rem;
      }

      /* Base Body (Mengisi Viewport) */
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        min-height: 100vh;
        background-color: var(--color-bg-page);
        color: var(--color-text-primary);
      }

      /* --- 2B. ROOT LAYOUT GUIDE STYLES --- */

      .RootLayout {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 0;
      }

      /* Horizontal Guides (Menggunakan ::before/::after pada RootLayout) */
      .RootLayout::before,
      .RootLayout::after {
        content: '';
        /* PENTING: Untuk dashed, kita gunakan border-top/bottom */
        border-top: var(--layout-guide-width) var(--layout-guide-style) var(--color-guide-border);
        height: 0; /* Tinggi 0 agar hanya border yang terlihat */
        position: absolute;
        left: 0;
        right: 0;
        z-index: 1;
      }
      .RootLayout::after {
        border-bottom: var(--layout-guide-width) var(--layout-guide-style) var(--color-guide-border);
        border-top: none; /* Hapus border-top jika menggunakan ::after untuk bottom */
      }

      .RootLayout::before {
        top: var(--layout-vertical-padding);
      }

      .RootLayout::after {
        bottom: var(--layout-vertical-padding);
      }

      /* CONTAINER DENGAN VERTICAL GUIDES */
      .RootLayoutContainer {
        width: 100%;
        max-width: var(--layout-max-width);
        min-height: 100vh;
        position: relative;
        padding-top: var(--layout-vertical-padding);
        padding-bottom: var(--layout-footer-height);

        /* Vertical Guides (Border Kiri & Kanan) */
        border-left: var(--layout-guide-width) var(--layout-guide-style) var(--color-guide-border);
        border-right: var(--layout-guide-width) var(--layout-guide-style) var(--color-guide-border);
      }

      /* Footer */
      .RootLayoutFooter {
        height: var(--layout-footer-height);
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        padding: 0 var(--layout-content-padding);
      }

      /* --- 2C. KONTEN DEMO UTAMA --- */

      .RootLayoutContent {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-grow: 1;
      }

      /* Reset Judul agar rata kiri */
      .RootLayoutContent > h1,
      .RootLayoutContent > h2,
      .RootLayoutContent > p,
      .RootLayoutContent > hr {
        width: 100%;
        text-align: left;
        margin: 0;
      }

      /* Wrapper Marquee */
      .container-wrapper {
        width: 100%;
        max-width: 100%;
      }

      .news-wrapper {
        background-color: var(--um-color-container-bg);
      }

      .marquee-content-row {
        display: flex;
        align-items: center;
        width: 100%;
      }

      /* --- 2D. VERTICAL SEPARATOR/DIVIDER UNTUK LABEL --- */

      /* 1. Breaking News Label (Di Latar Belakang Gelap) */
      .breaking-news-label {
        background-color: var(--color-accent-red);
        color: white;
        font-weight: 800;
        font-size: 1.25rem;
        padding: 10px 15px;
        margin-right: 0;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        /* Menggunakan variabel guides untuk konsistensi */
        border-right: var(--layout-guide-width) solid white;
      }

      #marquee-news,
      #marquee-logo-left {
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="RootLayout">
      <div class="RootLayoutContainer">
        <div class="RootLayoutContent">
          <h2>🚨 Breaking News Ticker</h2>

          <div class="container-wrapper news-wrapper">
            <div class="marquee-content-row">
              <span class="breaking-news-label"> BREAKING NEWS </span>
              <div id="marquee-news" style="flex-grow: 1"></div>
            </div>
          </div>

          <h2>⭐ Partner Logo Pattern</h2>

          <div class="container-wrapper logo-wrapper">
            <div id="marquee-logo-left" style="flex-grow: 1"></div>
            <div id="marquee-logo-right" style="flex-grow: 1"></div>
          </div>
        </div>
        <span class="RootLayoutFooter"></span>
      </div>
    </div>
    <script type="module" data-label="UNIVERSAL_MARQUEE_CORE_JS">
      /**
       * Sub-module 1: ContentBuilder
       * Bertanggung jawab untuk membuat elemen DOM dan mengukur lebar siklus.
       */
      class ContentBuilder {
        #opts;

        constructor(options) {
          this.#opts = options;
        }

        buildCycleContent() {
          const frag = document.createDocumentFragment();

          const sepStyle = `
              color: var(--um-color-separator); 
              flex-shrink: 0;
              display: flex;
              align-items: center;
              font-size: 0.9em;
          `;

          // Margin Horizontal Separator = setengah dari --um-gap. Ini yang menyediakan jarak.
          const marginStyle = `margin: 0 calc(var(--um-gap) / 2);`;

          for (const item of this.#opts.items) {
            let node = this.#opts.renderItem(item);

            if (!(node instanceof Element)) {
              const wrapper = document.createElement('span');
              wrapper.appendChild(node);
              node = wrapper;
            }

            frag.appendChild(node);

            // Hanya buat elemen separator jika separator adalah string (termasuk string kosong)
            if (typeof this.#opts.separator === 'string') {
              const sep = document.createElement('span');
              sep.textContent = this.#opts.separator;
              sep.style.cssText = sepStyle + marginStyle;
              frag.appendChild(sep);
            }
          }
          return frag;
        }

        buildCycleContainer() {
          const cycleContainer = document.createElement('div');
          cycleContainer.appendChild(this.buildCycleContent());
          return cycleContainer;
        }

        measureCycleWidth(root, masterTrack) {
          if (this.#opts.items.length === 0) return 0;

          const temp = document.createElement('div');
          temp.className = 'um-track';
          Object.assign(temp.style, { position: 'absolute', visibility: 'hidden' });
          temp.style.setProperty('--um-gap', this.#opts.gap);

          const measurementCycle = this.buildCycleContainer();
          temp.appendChild(measurementCycle);

          root.appendChild(temp);
          const cycleWidth = measurementCycle.offsetWidth;
          root.removeChild(temp);

          return cycleWidth;
        }
      }

      /**
       * Sub-module 2: AnimationController
       * Bertanggung jawab untuk WAAPI dan logic loop.
       */
      class AnimationController {
        #masterTrack;
        #opts;
        #animation = null;

        constructor(masterTrack, options) {
          this.#masterTrack = masterTrack;
          this.#opts = options;
        }

        startAnimation(cycleWidth) {
          if (this.#animation) this.#animation.cancel();

          const totalAnimationDistance = cycleWidth;
          const durationSeconds = totalAnimationDistance / this.#opts.speed;

          const keyframes = [
            { transform: 'translate3d(0px, 0, 0)' },
            { transform: `translate3d(-${totalAnimationDistance}px, 0, 0)` },
          ];

          const options = {
            duration: durationSeconds * 1000,
            iterations: 1,
            easing: 'linear',
            direction: this.#opts.direction === 'right' ? 'reverse' : 'normal',
          };

          this.#animation = this.#masterTrack.animate(keyframes, options);

          this.#animation.play();

          this.#animation.onfinish = () => {
            this.#animation.commitStyles();
            this.#animation.cancel();

            this.#masterTrack.style.transform = `translate3d(0px, 0, 0)`;

            this.startAnimation(cycleWidth);
          };
        }

        stop() {
          if (this.#animation) this.#animation.cancel();
        }
      }

      /**
       * Sub-module 3: ObserverManager
       * Bertanggung jawab untuk ResizeObserver.
       */
      class ObserverManager {
        #root;
        #resizeObserver;
        #resizeTimer = null;
        #reflowCallback;

        constructor(root, reflowCallback) {
          this.#root = root;
          this.#reflowCallback = reflowCallback;
        }

        start() {
          if (!('ResizeObserver' in window)) return;

          const resizeCallback = () => {
            if (this.#resizeTimer) {
              cancelAnimationFrame(this.#resizeTimer);
            }
            this.#resizeTimer = requestAnimationFrame(this.#reflowCallback);
          };

          this.#resizeObserver = new ResizeObserver(resizeCallback);
          this.#resizeObserver.observe(this.#root);
        }

        stop() {
          if (this.#resizeObserver) {
            this.#resizeObserver.unobserve(this.#root);
          }
        }
      }

      /**
       * Core Class: UniversalMarquee
       */
      class UniversalMarquee {
        #root;
        #opts;
        #masterTrack = null;

        #contentBuilder;
        #animationController;
        #observerManager;

        constructor(selector, options) {
          this.#root = typeof selector === 'string' ? document.querySelector(selector) : selector;
          if (!this.#root) throw new Error('Element not found');

          const {
            speed = 30,
            gap = '2rem',
            direction = 'left',
            items = [],
            separator = '',
            renderItem = (item) => document.createTextNode(String(item)),
          } = options;

          this.#opts = {
            speed,
            gap,
            direction,
            items,
            separator,
            renderItem,
          };

          this.#root.dir = direction === 'rtl' ? 'rtl' : 'ltr';
          this.#root.style.setProperty('--um-gap', this.#opts.gap);
          this.#root.classList.add('um-container');

          this.#initModules();
        }

        #initModules() {
          this.#contentBuilder = new ContentBuilder(this.#opts);

          this.#_setupContent();

          this.#animationController = new AnimationController(this.#masterTrack, this.#opts);

          this.#observerManager = new ObserverManager(this.#root, this.#_reflowAndRestart.bind(this));
          this.#observerManager.start();
        }

        #_setupContent() {
          this.#masterTrack = document.createElement('div');
          this.#masterTrack.className = 'um-track';

          if (this.#opts.direction === 'right') {
            this.#masterTrack.classList.add('um-right');
          } else {
            this.#masterTrack.classList.remove('um-right');
          }

          this.#root.innerHTML = '';
          this.#root.appendChild(this.#masterTrack);

          requestAnimationFrame(this.#_reflowAndRestart.bind(this));
        }

        #_reflowAndRestart() {
          const cycleWidth = this.#contentBuilder.measureCycleWidth(this.#root, this.#masterTrack);

          if (cycleWidth === 0 || this.#opts.items.length === 0) {
            this.#animationController.stop();
            return;
          }

          let cyclesNeeded = Math.ceil(this.#root.offsetWidth / cycleWidth) + 2;
          cyclesNeeded = Math.max(3, cyclesNeeded);

          this.#masterTrack.innerHTML = '';
          const content = document.createDocumentFragment();
          for (let i = 0; i < cyclesNeeded; i++) {
            content.appendChild(this.#contentBuilder.buildCycleContainer());
          }
          this.#masterTrack.appendChild(content);

          const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!prefersReduced) {
            this.#animationController.startAnimation(cycleWidth);
          } else {
            this.#animationController.stop();
          }
        }
      }

      window.UniversalMarquee = UniversalMarquee;
    </script>

    <script type="module" data-label="DEMO_CONFIGURATION_JS">
      // --- 1. DATA UNTUK KEDUA DEMO ---
      const LOGO_URLS = {
        google: 'https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg',
        amazon: 'https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg',
        microsoft: 'https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg',
        apple: 'https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg',
        tesla: 'https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png',
        spotify: 'https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg',
        github: 'https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg',
        slack: 'https://upload.wikimedia.org/wikipedia/commons/d/d5/Slack_icon_2019.svg',
      };

      const LOGO_ITEMS = [
        { type: 'image', src: LOGO_URLS.google, alt: 'Google Logo' },
        { type: 'image', src: LOGO_URLS.amazon, alt: 'Amazon Logo' },
        { type: 'image', src: LOGO_URLS.microsoft, alt: 'Microsoft Logo' },
        { type: 'image', src: LOGO_URLS.apple, alt: 'Apple Logo' },
        { type: 'image', src: LOGO_URLS.tesla, alt: 'Tesla Logo' },
        { type: 'image', src: LOGO_URLS.spotify, alt: 'Spotify Logo' },
        { type: 'image', src: LOGO_URLS.github, alt: 'GitHub Logo' },
        { type: 'image', src: LOGO_URLS.slack, alt: 'Slack Logo' },
      ];

      const NEWS_ITEMS = [
        'tunjukkan Trump, Clinton, dan tokoh lain',
        {
          type: 'image',
          src: 'https://cdn.iconscout.com/icon/free/png-256/ukraine-1815893-1538356.png',
          alt: 'Bendera Ukraina',
        },
        'Rusia serang Ukraina dengan 450 drone dan 30 rudal, jutaan rumah gelap gulita',
        {
          type: 'image',
          src: 'https://cdn.iconscout.com/icon/free/png-256/syria-1815915-1538378.png',
          alt: 'Bendera Suriah',
        },
        'Dua tentara AS tewas dibunuh penembak ISIS di Suriah',
        'Netflix beli Warner Bros. dalam kesepakatan miliaran dolar',
        { type: 'html', content: '<span style="color: gold; margin-left: 5px;">⭐ NEW</span>' },
        'Uni Eropa denda X (Twitter) atas pelanggaran privasi',
        'Gempa 7,6 SR guncang Jepang, peringatan tsunami dikeluarkan',
      ];

      // --- 2. RENDERER KUSTOM ---

      const customItemRenderer = (item) => {
        if (typeof item === 'string') {
          const el = document.createElement('a');
          el.href = '#';
          el.textContent = item;
          el.tabIndex = -1;
          Object.assign(el.style, {
            color: 'var(--um-color-separator)',
            textDecoration: 'none',
            padding: '0 5px',
            fontWeight: 'normal',
            transition: 'color 0.3s ease',
          });
          el.onmouseover = () => (el.style.color = 'var(--um-color-accent)');
          el.onmouseout = () => (el.style.color = 'var(--um-color-separator)');
          return el;
        } else if (item && item.type === 'image') {
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.alt || 'Content Image';
          img.tabIndex = -1;

          Object.assign(img.style, {
            verticalAlign: 'middle',
            margin: '0 5px',
          });
          return img;
        } else if (item && item.type === 'html') {
          const span = document.createElement('span');
          span.innerHTML = item.content;
          span.tabIndex = -1;
          return span;
        }
        return document.createTextNode(String(item));
      };

      // --- 3. INISIALISASI ---

      const initApp = () => {
        const newsMarqueeRoot = document.getElementById('marquee-news');
        const logoMarqueeLeftRoot = document.getElementById('marquee-logo-left');
        const logoMarqueeRightRoot = document.getElementById('marquee-logo-right');

        if (newsMarqueeRoot) {
          // Konfigurasi Marquee Breaking News: Simbol diperlukan
          new window.UniversalMarquee('#marquee-news', {
            speed: 40,
            gap: '3rem',
            direction: 'left',
            items: NEWS_ITEMS,
            separator: ' • ', // SIMBOL VISUAL
            renderItem: customItemRenderer,
          });
        }

        if (logoMarqueeLeftRoot) {
          // Konfigurasi Marquee Logo Pattern: Tidak perlu simbol (menggunakan default '')

          // Atur ukuran dan gap spesifik logo melalui CSS Variable Override
          logoMarqueeLeftRoot.style.setProperty('--um-font-size', '1.5rem');
          logoMarqueeLeftRoot.style.setProperty('--um-gap', '6rem');

          new window.UniversalMarquee('#marquee-logo-left', {
            speed: 10,
            gap: '6rem',
            direction: 'right',
            items: LOGO_ITEMS,
            renderItem: customItemRenderer,
          });
        }

        if (logoMarqueeRightRoot) {
          // Konfigurasi Marquee Logo Pattern: Tidak perlu simbol (menggunakan default '')

          // Atur ukuran dan gap spesifik logo melalui CSS Variable Override
          logoMarqueeRightRoot.style.setProperty('--um-font-size', '1.5rem');
          logoMarqueeRightRoot.style.setProperty('--um-gap', '6rem');

          new window.UniversalMarquee('#marquee-logo-right', {
            speed: 10,
            gap: '6rem',
            direction: 'left',
            items: LOGO_ITEMS,
            renderItem: customItemRenderer,
          });
        }
      };

      document.addEventListener('DOMContentLoaded', initApp);
    </script>
  </body>
</html>
