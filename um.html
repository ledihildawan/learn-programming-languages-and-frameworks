<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Marquee v6.2 - High Contrast Neumorphic Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* --- REVISED COLOR PALETTE & GLOBAL STYLES (High Contrast) --- */
      :root {
        /* High Contrast Dark Mode */
        --bg-page-dark: #12121e; /* Sangat gelap untuk kontras maksimum */
        --text-page-dark: #f0f0f4; /* Putih off-white */
        --shadow-light: rgba(255, 255, 255, 0.08); /* Sedikit lebih terang */
        --shadow-dark: rgba(0, 0, 0, 0.7); /* Lebih gelap */
        /* Glass Base Dark: Lebih buram (kurangi opacity) agar mudah dibaca */
        --glass-base: rgba(255, 255, 255, 0.05); /* Latar belakang glass lebih transparan lagi, meniru mockup */
        --card-bg-dark: #20202a; /* Warna latar belakang kartu yang solid dan kontras dengan BG utama */
        --glass-border: rgba(255, 255, 255, 0.1);
        /* High Contrast Light Mode */
        --bg-page-light: #f5f5f9; /* Sangat terang */
        --text-page-light: #12121e; /* Sangat gelap */
        --card-bg-light: #ffffff;
      }
      .light {
        --bg-page-dark: var(--bg-page-light);
        --text-page-dark: var(--text-page-light);
        --shadow-light: rgba(255, 255, 255, 0.8);
        --shadow-dark: rgba(100, 100, 100, 0.3);
        /* Glass Base Light: Transparan lebih rendah untuk kontras yang lebih baik */
        --glass-base: rgba(255, 255, 255, 0.9);
        --card-bg-dark: var(--card-bg-light);
        --glass-border: rgba(100, 100, 100, 0.15);
      }
      body {
        transition:
          background-color 0.5s,
          color 0.5s;
        background-color: var(--bg-page-dark);
        color: var(--text-page-dark);
      }
      /* 1. GLASSMORPHIC CARD STYLES - Diubah menjadi Solid/Soft Card (Sesuai Mockup) */
      .glass-card {
        background-color: var(--card-bg-dark);
        border: 1px solid var(--glass-border);
        border-radius: 1rem; /* Sudut lebih kecil (16px) */
        box-shadow:
          0 10px 30px var(--shadow-dark),
          0 5px 15px rgba(0, 0, 0, 0.1);
        transition: all 0.5s ease;
      }
      /* 2. NEUMORPHIC BUTTON STYLES (Override Tailwind) */
      .neumorphic-button {
        border-radius: 0.5rem; /* Sudut lebih tajam di tombol */
        transition: all 0.3s ease;
        padding: 0.5rem 1rem;
        font-size: 0.875rem; /* text-sm */
        font-weight: 700;
        cursor: pointer;
        /* Initial Outward Soft Shadow */
        box-shadow:
          2px 2px 4px var(--shadow-dark),
          -2px -2px 4px var(--shadow-light);
      }
      .neumorphic-button:hover {
        opacity: 0.9;
      }
      .neumorphic-button:active {
        /* Pressed Inward Shadow */
        box-shadow:
          inset 1px 1px 3px var(--shadow-dark),
          inset -1px -1px 3px var(--shadow-light);
        transform: translateY(1px);
      }
      /* Marquee item colors (Kontras Tinggi) */
      .text-red-300 {
        color: #f87171;
      }
      .light .text-red-700 {
        color: #b91c1c;
      }
      .text-indigo-300 {
        color: #a5b4fc;
      }
      .light .text-indigo-700 {
        color: #4338ca;
      }
      .text-cyan-300 {
        color: #67e8f9;
      }
      .light .text-cyan-700 {
        color: #0e7490;
      }
      .text-green-400 {
        color: #4ade80;
      }
      .text-red-400 {
        color: #f87171;
      }
      /* --- MARQUEE CORE STYLES (Penyesuaian Visual) --- */
      #marquee-stock {
        height: 180px;
        padding: 0;
        border: none;
        display: flex; /* Aktifkan flex untuk menampung dua kolom */
        gap: 1.5rem;
        justify-content: space-around;
      }
      /* Stock items inside vertical marquee */
      #marquee-stock .stock-item-container {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      #marquee-stock .stock-item-container .um-track {
        flex-direction: column;
        padding-bottom: 0;
      }
      /* Fading mask adjustment for mockup style */
      .um-fade-mask::before,
      .um-fade-mask::after {
        content: '';
        position: absolute;
        z-index: 10;
        pointer-events: none;
      }
      /* Horizontal Fade */
      .um-container:not(.um-vertical).um-fade-mask::before {
        left: 0;
        top: 0;
        bottom: 0;
        width: var(--um-fade-start);
        background: linear-gradient(to right, var(--card-bg-dark) 0%, rgba(0, 0, 0, 0) 100%);
      }
      .um-container:not(.um-vertical).um-fade-mask::after {
        right: 0;
        top: 0;
        bottom: 0;
        width: calc(100% - var(--um-fade-end));
        background: linear-gradient(to left, var(--card-bg-dark) 0%, rgba(0, 0, 0, 0) 100%);
      }
      /* Vertical Fade */
      .um-container.um-vertical.um-fade-mask::before {
        top: 0;
        left: 0;
        right: 0;
        height: var(--um-fade-start);
        background: linear-gradient(to bottom, var(--card-bg-dark) 0%, rgba(0, 0, 0, 0) 100%);
      }
      .um-container.um-vertical.um-fade-mask::after {
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(100% - var(--um-fade-end));
        background: linear-gradient(to top, var(--card-bg-dark) 0%, rgba(0, 0, 0, 0) 100%);
      }
      /* --- CORE MARQUEE (PRESERVATION) --- */
      /* (Semua kode Marquee Core lainnya tetap tidak berubah untuk menjaga fungsionalitas) */
      .um-container {
        display: flex;
        overflow: hidden;
        user-select: none;
        width: 100%;
        --um-duration: 0s;
        --um-gap: 2rem;
        --um-timing-function: linear;
        contain: layout style paint;
        position: relative;
      }
      .um-container.um-vertical {
        flex-direction: column;
        width: 100%;
      }
      .um-track {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: var(--um-gap);
        will-change: transform;
        transition: transform 0.1s ease-out;
      }
      .um-container.um-vertical .um-track {
        flex-direction: column;
        height: max-content;
        padding-bottom: var(--um-gap);
      }
      .um-container:not(.um-vertical) .um-track {
        padding-right: var(--um-gap);
      }
      @media (prefers-reduced-motion: reduce) {
        .um-container .um-animate {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
      .um-animate {
        animation: um-scroll var(--um-duration) var(--um-timing-function) infinite;
      }
      .um-paused .um-animate {
        animation-play-state: paused !important;
      }
      .um-pause-hover:hover .um-animate {
        animation-play-state: paused;
      }
      .um-right {
        animation-direction: reverse;
      }
      @keyframes um-scroll {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(calc(-100% / var(--um-num-cycles, 1)), 0, 0);
        }
      }
      .um-container.um-vertical .um-animate {
        animation-name: um-scroll-vertical;
      }
      @keyframes um-scroll-vertical {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, calc(-100% / var(--um-num-cycles, 1)), 0);
        }
      }
      .um-container.um-vertical .um-track.um-down {
        animation-direction: reverse;
      }
      .um-fade-mask {
        --um-fade-start: 5%;
        --um-fade-end: 95%;
      }
      .um-logo-monochrome {
        filter: grayscale(100%) brightness(0) invert(1);
        transition: filter 0.4s ease;
      }
      .light .um-logo-monochrome {
        filter: grayscale(100%) brightness(0);
      }
      .um-logo-wrapper {
        position: relative;
        width: var(--um-logo-size);
        height: var(--um-logo-size);
        flex-shrink: 0;
        padding: 0;
        margin: 0;
      }
      .um-logo-raster,
      .um-logo-svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .um-logo-error {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #333;
        border: 1px dashed #777;
        color: #ccc;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-family: sans-serif;
        text-align: center;
        box-sizing: border-box;
      }
      .um-logo-wrapper.um-has-error .um-logo-error {
        display: flex;
      }
      .um-logo-wrapper.um-has-error .um-logo-raster,
      .um-logo-wrapper.um-has-error .um-logo-svg {
        display: none;
      }
      .light .um-logo-error {
        background-color: #ccc;
        border-color: #333;
        color: #333;
      }
    </style>
  </head>
  <body class="bg-page-dark text-page-dark min-h-screen flex flex-col items-center py-10 px-4 font-sans">
    <div class="w-full max-w-4xl flex flex-col items-center">
      <h1 class="text-4xl font-extrabold text-center text-page-dark">UNIVERSAL MARQUEE</h1>
    </div>
    <button
      id="theme-toggle"
      class="fixed top-6 right-6 z-50 rounded-full p-4 transition duration-300"
      style="background-color: #4f46e5; color: white; box-shadow: 0 0 10px #4f46e5"
      onclick="this.blur()"
    >
      <span id="theme-icon" class="text-2xl">☀️</span>
    </button>
    <main class="w-full max-w-4xl space-y-8 mt-10">
      <div class="glass-card p-6" id="marquee-news-parent">
        <h2 class="text-lg font-bold uppercase tracking-widest text-red-300 light:text-red-700 mb-4">
          NEWS TICKER (HORIZONTAL)
        </h2>
        <div id="marquee-news" class="py-2 mb-4 border-y border-red-500/50"></div>
        <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-3 pt-2">
          <p id="status-display" class="text-sm text-page-dark opacity-70">
            Status: <span id="is-paused-status" class="font-semibold">Berjalan</span>
          </p>
          <div class="flex justify-start flex-wrap gap-2">
            <button id="toggle-btn" class="neumorphic-button bg-yellow-500 text-gray-900 hover:bg-yellow-400">
              Toggle Pause()
            </button>
            <button id="stop-btn" class="neumorphic-button bg-red-600 text-white hover:bg-red-500">STOP (Reset)</button>
            <button id="update-soft-btn" class="neumorphic-button bg-indigo-500 text-white hover:bg-indigo-400">
              Update Items (Soft)
            </button>
            <button id="destroy-btn" class="neumorphic-button bg-purple-600 text-white hover:bg-purple-500">
              Manual Destroy()
            </button>
            <button id="update-hard-btn" class="neumorphic-button bg-purple-500 text-white hover:bg-purple-400">
              Update Items (Hard)
            </button>
          </div>
        </div>
      </div>
      <div class="glass-card p-6">
        <h2 class="text-lg font-bold uppercase tracking-widest text-indigo-300 light:text-indigo-700 mb-4">
          REAL-TIME STOCK TICKER (VERTICAL)
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
          <div class="md:col-span-2">
            <div id="marquee-stock" class="px-2 py-2 overflow-hidden rounded-lg border border-indigo-500/30"></div>
          </div>
          <div class="md:col-span-1 space-y-3">
            <button id="stock-update-btn" class="w-full neumorphic-button bg-green-600 text-white hover:bg-green-500">
              Simulasi Update Data (Soft Update)
            </button>
            <p class="text-xs text-page-dark opacity-70">
              Marquee ini bergerak vertikal, menampilkan dua set data yang diperbarui secara *soft* (tanpa hitung ulang
              animasi).
            </p>
          </div>
        </div>
      </div>
      <div class="glass-card p-6">
        <h2 class="text-lg font-bold uppercase tracking-widest text-cyan-300 light:text-cyan-700 mb-4">
          BRAND PARTNER (IMAGE LOAD OPTIMIZATION)
        </h2>
        <div id="marquee-brands" class="py-6 border-y border-cyan-500/50"></div>
      </div>
    </main>
    <script>
      // Class UniversalMarquee dan Renderer Functions (UNMODIFIED)
      class UniversalMarquee {
        constructor(selector, options) {
          this.root = typeof selector === 'string' ? document.querySelector(selector) : selector;
          if (!this.root) throw new Error('Element not found');
          this.id = this.root.id || 'UM_Instance_' + Math.random().toString(36).substring(2, 6);
          this.opts = {
            duration: options.duration ?? '40s',
            speed: options.speed ?? null,
            speedPreset: options.speedPreset ?? null,
            gap: options.gap ?? '2rem',
            direction: options.direction ?? 'left',
            pauseOnHover: options.pauseOnHover ?? true,
            items: options.items ?? [],
            renderItem: options.renderItem ?? ((i) => document.createTextNode(String(i))),
            separator: options.separator ?? null,
            monochrome: options.monochrome ?? false,
            fadeMask: options.fadeMask ?? true,
            disableMotion: options.disableMotion ?? false,
            fadeStart: options.fadeStart ?? '5%',
            fadeEnd: options.fadeEnd ?? '95%',
            autoReverse: options.autoReverse ?? false,
            timingFunction: options.timingFunction ?? 'linear',
            onCycleStart: options.onCycleStart ?? (() => {}),
            onPlay: options.onPlay ?? (() => {}),
            onPause: options.onPause ?? (() => {}),
            onDestroy: options.onDestroy ?? (() => {}),
            onRecalculate: options.onRecalculate ?? (() => {}),
            maxCycles: options.maxCycles ?? null,
          };
          this.isVertical = this.opts.direction === 'up' || this.opts.direction === 'down';
          this.isIntersecting = true;
          this.isPageVisible = true;
          this.isWindowFocused = true;
          this.isManuallyPaused = false;
          this._isAutoPausedState = false;
          this.masterTrack = null;
          this.currentDirection = this.opts.direction;
          this.autoReverseInterval = null;
          this.resizeTimer = null;
          this.currentCycleCount = 0;
          this._isDestroyed = false;
          this._dimensions = { cycleDimension: 0, containerDimension: 0, cycles: 0, calculatedDuration: '0s' };
          this.handleVisibilityChange = this._handleVisibilityChange.bind(this);
          this.handleBlur = this._handleBlur.bind(this);
          this.handleFocus = this._handleFocus.bind(this);
          this.handleAnimationIteration = this._handleAnimationIteration.bind(this);
          this.handleTouchStart = this._handleTouchStart.bind(this);
          this.handleTouchEnd = this._handleTouchEnd.bind(this);
          if (this.currentDirection === 'rtl' && !this.isVertical) {
            this.currentDirection = 'right';
            this.root.dir = 'rtl';
          } else {
            this.root.dir = 'ltr';
          }
          this.root.setAttribute('role', 'marquee');
          this.root.setAttribute('aria-live', 'off');
          this.init();
        }
        get isPaused() {
          return this.root.classList.contains('um-paused');
        }
        get isPlaying() {
          return !this.isPaused;
        }
        get isAutoPaused() {
          return this._isAutoPausedState;
        }
        getDimension() {
          return this._dimensions;
        }
        togglePause() {
          if (this._isDestroyed) return;
          if (this.isPaused) {
            this.play();
          } else {
            this.pause();
          }
        }
        stop() {
          if (this._isDestroyed) return;
          this.pause();
          this._resetPosition();
          console.log(`[UniversalMarquee ${this.id}] Stopped and reset position.`);
        }
        updateItems(newItems, options = {}) {
          if (this._isDestroyed) {
            console.warn(`[UniversalMarquee ${this.id}] Cannot call updateItems(): Instance has been destroyed.`);
            return;
          }
          if (!Array.isArray(newItems)) {
            console.error(`[UniversalMarquee ${this.id}] updateItems() requires an array.`);
            return;
          }
          if (newItems.length === 0) {
            console.warn(`[UniversalMarquee ${this.id}] Items diupdate menjadi kosong. Marquee akan berhenti.`);
          }

          this.opts.items.forEach((item) => {
            if (item.hasFailedLoading) delete item.hasFailedLoading;
          });

          this.opts.items = newItems;
          this.currentCycleCount = 0;

          const isSoftUpdate = options.soft && this.masterTrack && this._dimensions.cycles > 0;

          if (isSoftUpdate) {
            this.root.classList.add('um-paused');
            this.masterTrack.innerHTML = '';

            const cycles = this._dimensions.cycles;
            const content = document.createDocumentFragment();

            content.appendChild(this._createCycle([]));
            for (let i = 1; i < cycles; i++) content.appendChild(this._createCycle([]).cloneNode(true));

            this.masterTrack.appendChild(content);
            this.masterTrack.style.setProperty('--um-num-cycles', cycles);

            requestAnimationFrame(() => this._updatePauseState());

            this.opts.onRecalculate(this, { reason: 'soft-update' });
            console.log(
              `[UniversalMarquee ${this.id}] updated (SOFT) with ${newItems.length} new item(s). Preserved ${cycles} cycles.`
            );
          } else {
            this._fillScreen('update');
            console.log(`[UniversalMarquee ${this.id}] updated (HARD) with ${newItems.length} new item(s).`);
          }
        }
        play() {
          if (this._isDestroyed) return;
          this.isManuallyPaused = false;
          this._updatePauseState();
        }
        pause() {
          if (this._isDestroyed) return;
          this.isManuallyPaused = true;
          this._isAutoPausedState = false;
          this.root.classList.add('um-paused');
          this.opts.onPause(this, { reason: 'manual-pause' });
        }
        setDirection(newDirection) {
          /* ... */
          if (this._isDestroyed) return;
          let directionChanged = false;
          const isNewVertical = newDirection === 'up' || newDirection === 'down';
          const isNewHorizontal = newDirection === 'left' || newDirection === 'right' || newDirection === 'rtl';

          if ((this.isVertical && isNewHorizontal) || (!this.isVertical && isNewVertical)) {
            console.error(
              `[UniversalMarquee ${this.id}] Cannot change from ${this.isVertical ? 'vertical' : 'horizontal'} to the opposite orientation.`
            );
            return;
          }

          if (isNewHorizontal) {
            if (newDirection === 'rtl') {
              if (this.currentDirection !== 'right' || this.root.dir !== 'rtl') {
                this.currentDirection = 'right';
                this.root.dir = 'rtl';
                directionChanged = true;
              }
            } else if (this.currentDirection !== newDirection) {
              this.currentDirection = newDirection;
              this.root.dir = 'ltr';
              directionChanged = true;
            }
          } else if (isNewVertical) {
            if (this.currentDirection !== newDirection) {
              this.currentDirection = newDirection;
              directionChanged = true;
            }
          } else {
            console.error(
              `[UniversalMarquee ${this.id}] setDirection() requires 'left', 'right', 'rtl', 'up', or 'down'.`
            );
            return;
          }

          if (directionChanged) {
            this._applyDirection();
            if (this.opts.speed) this._fillScreen();
          }
        }
        setDuration(newDuration) {
          /* ... */
          if (this._isDestroyed) return;
          if (typeof newDuration !== 'string' || !newDuration.endsWith('s')) {
            console.error(
              `[UniversalMarquee ${this.id}] setDuration() requires a string ending with 's', e.g., '15s'.`
            );
            return;
          }
          this.opts.speed = null;
          this._applyDuration(newDuration);

          if (this.opts.autoReverse) {
            this._stopAutoReverse();
            this._startAutoReverse();
          }
          console.log(`[UniversalMarquee ${this.id}] duration updated to: ${newDuration}`);
        }
        destroy(removeRoot = true) {
          /* ... */
          if (this._isDestroyed) return;
          this._isDestroyed = true;
          this.pause();
          this._stopAutoReverse();
          this._resetPosition(0);
          if (this.masterTrack) {
            this.masterTrack.removeEventListener('animationiteration', this.handleAnimationIteration);
          }
          document.removeEventListener('visibilitychange', this.handleVisibilityChange);
          window.removeEventListener('blur', this.handleBlur);
          window.removeEventListener('focus', this.handleFocus);
          if (this.resizeObserver) this.resizeObserver.disconnect();
          if (this.intersectionObserver) this.intersectionObserver.disconnect();
          this.root.removeAttribute('role');
          this.root.removeAttribute('aria-live');
          this.root.innerHTML = '';
          this.root.classList.remove('um-container', 'um-pause-hover', 'um-fade-mask', 'um-paused', 'um-vertical');
          this.root.removeAttribute('dir');
          this.root.removeAttribute('style');
          this.opts.onDestroy(this, { rootRemoved: removeRoot });
          if (removeRoot && this.root.parentNode) {
            const rootId = this.root.id || this.root.className;
            this.root.parentNode.removeChild(this.root);
            console.log(`[UniversalMarquee ${this.id}] Instance destroyed and removed from DOM: ${rootId}`);
          } else {
            console.log(
              `[UniversalMarquee ${this.id}] Instance destroyed (listeners removed), but DOM element preserved: ${this.root.id || this.root.className}`
            );
          }
        }
        _applyDuration(duration) {
          this.root.style.setProperty('--um-duration', duration);
        }
        _applyDirection() {
          if (!this.masterTrack) return;
          this.masterTrack.classList.remove('um-right', 'um-down');
          if (this.isVertical) {
            if (this.currentDirection === 'down') {
              this.masterTrack.classList.add('um-down');
            }
          } else {
            if (this.currentDirection === 'right' || this.currentDirection === 'rtl') {
              this.masterTrack.classList.add('um-right');
            }
          }
        }
        _resetPosition(delayMs = 100) {
          if (!this.masterTrack) return;
          this.masterTrack.classList.remove('um-animate');
          this.masterTrack.style.transform = 'translate3d(0, 0, 0)';
          setTimeout(() => {
            if (this.masterTrack) {
              this.masterTrack.classList.add('um-animate');
            }
          }, delayMs);
        }
        _startAutoReverse() {
          /* ... */
          if (this.autoReverseInterval) this._stopAutoReverse();
          const durationStyle = this.root.style.getPropertyValue('--um-duration');
          const durationMatch = durationStyle.match(/(\d+\.?\d*)s/);
          if (!durationMatch) return;
          const durationMs = parseFloat(durationMatch[1]) * 1000;
          this.autoReverseInterval = setInterval(() => {
            if (this.isVertical) {
              this.currentDirection = this.currentDirection === 'up' ? 'down' : 'up';
            } else {
              this.currentDirection = this.currentDirection === 'left' ? 'right' : 'left';
            }
            this._applyDirection();
          }, durationMs);
        }
        _stopAutoReverse() {
          if (this.autoReverseInterval) {
            clearInterval(this.autoReverseInterval);
            this.autoReverseInterval = null;
          }
        }
        init() {
          /* ... */
          const SPEED_MAP = { slow: '60s', normal: '40s', fast: '20s' };
          let finalDuration = this.opts.duration;
          if (this.opts.speedPreset && SPEED_MAP[this.opts.speedPreset]) {
            finalDuration = SPEED_MAP[this.opts.speedPreset];
            this.opts.duration = finalDuration;
          }
          if (this.opts.disableMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            finalDuration = '0s';
            this.opts.duration = finalDuration;
            this.root.classList.add('um-paused');
            this.root.setAttribute('aria-live', 'assertive');
            console.warn(`[UniversalMarquee ${this.id}] Motion disabled via config/OS preference. Marquee is static.`);
          }
          this.root.classList.add('um-container');
          if (this.isVertical) this.root.classList.add('um-vertical');
          if (this.opts.pauseOnHover) this.root.classList.add('um-pause-hover');
          if (this.opts.fadeMask) this.root.classList.add('um-fade-mask');
          this.root.style.setProperty('--um-timing-function', this.opts.timingFunction);
          this._applyDuration(finalDuration);
          this.root.style.setProperty('--um-gap', this.opts.gap);
          this.root.style.setProperty('--um-fade-start', this.opts.fadeStart);
          this.root.style.setProperty('--um-fade-end', this.opts.fadeEnd);
          this._setupContent();
          this._registerObservers();
          this._registerVisibilityObserver();
          this._registerWindowFocus();
          this._registerTouchHandlers();

        _setupContent() {
          /* ... */
          this.masterTrack = document.createElement('div');
          this.masterTrack.className = 'um-track um-animate';
          this._applyDirection();
          this.root.innerHTML = '';
          this.root.appendChild(this.masterTrack);
          this.masterTrack.addEventListener('animationiteration', this.handleAnimationIteration);
          requestAnimationFrame(this._fillScreen.bind(this, 'initial'));

        _createCycle(imagePromises) {
          /* ... */
          const frag = document.createDocumentFragment();
          const shouldBeMonochrome = this.opts.monochrome;
          let isFirstCycle = imagePromises.length === 0 && this.masterTrack.children.length === 0;

          for (let i = 0; i < this.opts.items.length; i++) {
            const item = this.opts.items[i];
            const node = this.opts.renderItem(item);

            const imgElement = node.querySelector('.um-logo-raster');

            if (imgElement) {
              if (isFirstCycle) {
                const imgLoadPromise = new Promise((resolve) => {
                  if (imgElement.complete && imgElement.naturalWidth !== 0) {
                    resolve();
                  } else {
                    imgElement.addEventListener('load', resolve, { once: true });
                    imgElement.addEventListener('error', resolve, { once: true });
                  }
                });
                imagePromises.push(imgLoadPromise);
              }
            }

            const targetElement = node.querySelector('.um-logo-svg') || node.querySelector('.um-logo-raster');

            if (targetElement) {
              targetElement.classList.toggle('um-logo-monochrome', shouldBeMonochrome);
            }

            const outerWrapper = document.createElement('div');
            outerWrapper.style.flexShrink = '0';
            outerWrapper.style.display = 'flex';
            outerWrapper.style.alignItems = 'center';
            if (this.isVertical) outerWrapper.style.width = '100%';

            if (!isFirstCycle) {

            outerWrapper.appendChild(node);
            frag.appendChild(outerWrapper);

            if (this.opts.separator) {
              const sep = document.createElement('div');
              sep.style.flexShrink = '0';
              sep.style.display = 'flex';
              sep.style.alignItems = 'center';
              if (this.isVertical) sep.style.width = '100%';

              const sepNode =
                this.opts.separator instanceof Node
                  ? this.opts.separator.cloneNode(true)
                  : Object.assign(document.createElement('span'), {
                      textContent: String(this.opts.separator),
                    });

              frag.appendChild(sep);
            }

        _waitForImagesToLoad(tempElement) {
          /* ... */
          const images = tempElement.querySelectorAll('img');
          const promises = Array.from(images).map(
            (img) =>
              new Promise((resolve) => {
                if (img.complete) {
                  resolve();
                } else {
                  img.addEventListener('load', resolve, { once: true });
                  img.addEventListener('error', resolve, { once: true });
                }
              })
          );
          return Promise.all(promises);

        async _fillScreen(reason) {
          /* ... */
          if (this._isDestroyed) return;

          if (this.opts.items.length === 0) {
            if (this.masterTrack) this.masterTrack.innerHTML = '';
            this._dimensions = { cycleDimension: 0, containerDimension: 0, cycles: 0, calculatedDuration: '0s' };
            this._updatePauseState();

          this.root.classList.add('um-paused');
          this.masterTrack.innerHTML = '';
          this.currentCycleCount = 0;
          let imagePromises = [];

          temp.className = 'um-track';

          temp.style.visibility = 'hidden';
          temp.style.setProperty('--um-gap', this.opts.gap);
          if (this.isVertical) {
            temp.classList.add('um-vertical');
            temp.style.flexDirection = 'column';
          }

          temp.appendChild(this._createCycle(imagePromises));
          document.body.appendChild(temp);

          if (imagePromises.length > 0) {
            console.log(`[UniversalMarquee ${this.id}] Menunggu ${imagePromises.length} gambar untuk dimuat...`);
            await this._waitForImagesToLoad(temp);
          }

          const cycleDimension = this.isVertical ? temp.offsetHeight : temp.offsetWidth;
          const containerDimension = this.isVertical ? this.root.offsetHeight : this.root.offsetWidth;

          document.body.removeChild(temp);

          // BARU: Fail-Fast Error Handling
          if (cycleDimension === 0 || containerDimension === 0) {
            const errorType = cycleDimension === 0 ? 'Cycle Dimension Zero' : 'Container Dimension Zero';
            console.error(
              `[UniversalMarquee Error - ${this.id}] Cannot run marquee: Measured dimension is 0. Attempting soft destroy.`
            );
            this.destroy(false);
            this.isManuallyPaused = true;
            this.root.classList.add('um-paused');
            return;
          }

          let finalDuration = this.opts.duration;

          if (
            finalDuration === '0s' ||
            this.opts.disableMotion ||
            window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ) {
            this.masterTrack.appendChild(this._createCycle([]));
            this.masterTrack.style.removeProperty('--um-num-cycles');
            this._dimensions = { cycleDimension, containerDimension, cycles: 1, calculatedDuration: '0s' };

            this.root.classList.add('um-paused');
            return;
          } else {
            this.root.setAttribute('aria-live', 'off');
          }

          let cycles = Math.ceil(containerDimension / cycleDimension) + 2;
          if (cycles < 3) cycles = 3;
          if (cycles > 30) cycles = 30;

          if (this.opts.speed) {
            const speedMatch = this.opts.speed.match(/(\d+\.?\d*)px\/s/);
            if (speedMatch) {
              const speedPxPerSecond = parseFloat(speedMatch[1]);
              const totalAnimationDimension = cycleDimension * cycles;
              const newDuration = totalAnimationDimension / speedPxPerSecond;
              finalDuration = `${newDuration.toFixed(2)}s`;
              this._applyDuration(finalDuration);

              if (this.opts.autoReverse) {
                this._stopAutoReverse();
                this._startAutoReverse();
              }
            } else {
              this._applyDuration(this.opts.duration);
            }
          } else {
            this._applyDuration(this.opts.duration);
          }

          this._dimensions = { cycleDimension, containerDimension, cycles, calculatedDuration: finalDuration };

          this.opts.onRecalculate(this, { reason, dimensions: this._dimensions });
          console.log(`[UniversalMarquee ${this.id}] Recalculate complete. Output:`, this._dimensions);

          const content = document.createDocumentFragment();
          content.appendChild(this._createCycle([]));
          for (let i = 1; i < cycles; i++) content.appendChild(this._createCycle([]).cloneNode(true));

          this.masterTrack.appendChild(content);
          this.masterTrack.style.setProperty('--um-num-cycles', cycles);

          requestAnimationFrame(() => this._updatePauseState());
        }
        _registerObservers() {
          /* ... */
          const resizeCallback = () => {
            if (this.resizeTimer) {

            }
            this.resizeTimer = requestAnimationFrame(() => this._fillScreen('resize'));

          this.resizeObserver = new ResizeObserver(resizeCallback);
          this.resizeObserver.observe(this.root);
        }
        _updatePauseState() {
          /* ... */
          if (this.opts.duration === '0s' || this._isDestroyed) return;

          if (this.isManuallyPaused) {
            this.root.classList.add('um-paused');
            this._isAutoPausedState = false;
            return;
          }

          const shouldPause = !this.isIntersecting || !this.isPageVisible || !this.isWindowFocused;
          const isCurrentlyPaused = this.root.classList.contains('um-paused');

          this.root.classList.toggle('um-paused', shouldPause);

          this._isAutoPausedState = shouldPause;

          if (shouldPause) {
            this.root.setAttribute('aria-live', 'assertive');
          } else {

          if (shouldPause && !isCurrentlyPaused) {

          this.isWindowFocused = false;
          this._updatePauseState();

        _handleFocus() {

        _registerWindowFocus() {
          document.addEventListener('visibilitychange', this.handleVisibilityChange);
          window.addEventListener('blur', this.handleBlur);

        _registerTouchHandlers() {

        };

        if (!beritaMarqueeInstance) updateButtonStates(true);
        else updateMarqueeStatus();

        document.getElementById('toggle-btn')?.addEventListener('click', () => {
          if (beritaMarqueeInstance) beritaMarqueeInstance.togglePause();
        });

        document.getElementById('update-hard-btn')?.addEventListener('click', () => {
          if (!beritaMarqueeInstance) return;
          const newItems = ['✨ New Hard Content 1', '🚀 Full Recalculation!', '✅ Hard Update Done'];
          beritaMarqueeInstance.updateItems(newItems, { soft: false });
        });

        document.getElementById('update-soft-btn')?.addEventListener('click', () => {
          if (!beritaMarqueeInstance) return;
          const newItems = ['⭐ Soft Update A', '🔥 Soft Update B', '👍 Soft Update C'];
          beritaMarqueeInstance.updateItems(newItems, { soft: true });
        });

        document.getElementById('stop-btn')?.addEventListener('click', () => {
          if (beritaMarqueeInstance) beritaMarqueeInstance.stop();
        });

        document.getElementById('destroy-btn')?.addEventListener('click', (e) => {
          if (beritaMarqueeInstance) {
            beritaMarqueeInstance.destroy(false);
            beritaMarqueeInstance = null;
            updateButtonStates(true);

            const parent = document.getElementById('marquee-news-parent');
            if (parent) {
              const message = document.createElement('p');
              message.textContent = 'Marquee Manually Destroyed (Listeners removed).';
              message.className = 'text-center text-purple-400 font-bold mt-4';
              parent.appendChild(message);
            }
          }
        });
      };

      if (document.readyState === 'complete') initApp();
      else window.addEventListener('load', initApp);
    </script>
  </body>
</html>
