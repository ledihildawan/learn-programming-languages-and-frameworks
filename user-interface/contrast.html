<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Interface - Contrast</title>
    <style>
      @import url('https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap');

      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Montserrat';
      }
      .container {
        padding: 3em 2em;
      }
      header {
        position: relative;
        display: block;
        width: 100%;
      }
      header::after {
        content: '';
        position: absolute;
        z-index: -1;
        background: url('https://scrimba.com/op/assets/A2BYeyUZhGqBtiKyHvSZ2hQYKSVy5qJfhct246Y3Ga6PYre3cAw7LCjwmxKAcB6dgZHGod8JgdYDGonD3YVWgTfdXyFw3WnPRYrdxwNw28UtsPehsy9Xdrrfj2rERZURSUKv.jpeg');
        background-position: 0% 20%;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      h1 {
        margin: 0;
        font-size: 2.5em;
        color: #002a4e;
      }
      p {
        color: rgba(0, 0, 0, 0.3);
        margin-top: 0.5em;
        font-size: 0.9em;
        font-weight: bold;
      }
      a {
        background: #cccccc;
        padding: 0.8em;
        text-decoration: none;
        color: gray;
        font-weight: bold;
        font-size: 0.8em;
        border-radius: 0.4em;
        margin-top: 1.5em;
        display: inline-block;
        text-transform: uppercase;
      }

      /* Overwrites */

      p {
        color: #002a4e;
      }

      a {
        background: #006bc6;
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Take a vacation</h1>
        <p>Come and witness our amazing mountain views.</p>

        <a href="#">Explore now</a>
      </div>
    </header>
  </body>
</html>
