<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Interface - Visual Hierarchy</title>
    <style>
      @import url('https://fonts.googleapis.com/css?family=Nunito:400,700&display=swap');
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        padding: 2em;
        background: #5801cb;
        color: white;
        font-family: 'Nunito';
      }
      h1 {
        font-size: 1.1em;
      }

      .form-container {
        padding: 2em;
        display: grid;
        grid-template-columns: 70% auto;
        grid-template-rows: repeat(3, auto);
        grid-template-areas:
          'label label'
          'submit button'
          'info info';
      }

      label {
        display: block;
        font-size: 1.1em;
        grid-area: label;
        margin-bottom: 0.8em;
      }
      input[type='text'] {
        width: 90%;
        padding: 0.5em;
      }
      input[type='submit'] {
        padding: 0.5em;
        font-size: 0.8em;
        background: none;
        border: 1px solid white;
        color: white;
        cursor: pointer;
      }
      p {
        grid-area: info;
      }

      /* Improvements */

      h1 {
        font-size: 3em;
      }

      .form-container {
        background: #6900f3;
      }

      label {
        font-weight: bold;
        font-size: 1.2em;
      }

      input[type='submit'] {
        font-size: 1em;
        background: #ffed8c;
        color: #5801cb;
        border: none;
        font-weight: bold;
      }

      p {
        color: #caa2ff;
      }
    </style>
  </head>
  <body>
    <h1>Join the mailing list!</h1>

    <div class="container">
      <form>
        <div class="form-container">
          <label for="email">Email Address</label>

          <input type="text" id="email" />
          <p>Don't worry, we won't ever share your email!</p>

          <input type="submit" value="Submit email" />
        </div>
      </form>
    </div>
  </body>
</html>
