```sql
-- =============================================
-- 1. CONSTRAINTS (VALIDASI DATA LEVEL DB)
-- =============================================
-- Wallet tidak boleh negatif
ALTER TABLE "users" ADD CONSTRAINT chk_wallet_non_negative CHECK ("walletBalance" >= 0);
-- Harga room harus positif
ALTER TABLE "rooms" ADD CONSTRAINT chk_price_positive CHECK (price > 0);
-- Validasi tanggal booking
ALTER TABLE "bookings" ADD CONSTRAINT chk_checkin_future CHECK ("checkIn" >= CURRENT_DATE);
ALTER TABLE "bookings" ADD CONSTRAINT chk_checkin_before_checkout CHECK ("checkIn" < "checkOut");
-- Validasi durasi & harga booking
ALTER TABLE "bookings" ADD CONSTRAINT chk_nights_positive CHECK (nights > 0);
ALTER TABLE "bookings" ADD CONSTRAINT chk_total_price_positive CHECK ("totalPrice" > 0);
-- Validasi expired time (harus masa depan jika ada)
ALTER TABLE "bookings" ADD CONSTRAINT chk_expiredat_future CHECK ("expiredAt" > now() + interval '30 seconds' OR "expiredAt" IS NULL);
-- =============================================
-- 2. TRIGGER: AUTOMATIC FULL TEXT SEARCH (NEW)
-- =============================================
-- Membersihkan trigger/function lama jika ada (untuk safety replay)
DROP TRIGGER IF EXISTS trg_hotels_search_vector_update ON hotels;
DROP FUNCTION IF EXISTS hotels_search_vector_update;
-- Function untuk mengisi searchVector otomatis dari name, city, description
CREATE OR REPLACE FUNCTION hotels_search_vector_update() RETURNS TRIGGER AS $$
BEGIN
    NEW."searchVector" :=
        setweight(to_tsvector('english', COALESCE(NEW.name, '')), 'A') ||
        setweight(to_tsvector('english', COALESCE(NEW.city, '')), 'B') ||
        setweight(to_tsvector('english', COALESCE(NEW.description, '')), 'C');
    RETURN NEW;
END;
$$ LANGUAGE plpgsql;
-- Pasang trigger pada tabel hotels
CREATE TRIGGER trg_hotels_search_vector_update
    BEFORE INSERT OR UPDATE ON hotels
    FOR EACH ROW EXECUTE FUNCTION hotels_search_vector_update();
-- =============================================
-- 3. TRIGGER: PAYMENT AMOUNT CHECK
-- =============================================
DROP TRIGGER IF EXISTS trg_payment_amount_match ON payments;
DROP FUNCTION IF EXISTS check_payment_amount;
CREATE OR REPLACE FUNCTION check_payment_amount() RETURNS TRIGGER AS $$
BEGIN
  -- Payment amount harus sama persis dengan booking totalPrice
  IF NOT EXISTS (SELECT 1 FROM bookings WHERE id = NEW."bookingId" AND "totalPrice" = NEW.amount) THEN
    RAISE EXCEPTION 'Payment amount must equal Booking.totalPrice';
  END IF;
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;
CREATE TRIGGER trg_payment_amount_match
  BEFORE INSERT OR UPDATE ON payments
  FOR EACH ROW EXECUTE FUNCTION check_payment_amount();
-- =============================================
-- 4. TRIGGER: LEDGER IMMUTABLE & INTEGRITY
-- =============================================
DROP TRIGGER IF EXISTS trg_ledger_immutable ON host_ledgers;
DROP FUNCTION IF EXISTS enforce_ledger_balance;
CREATE OR REPLACE FUNCTION enforce_ledger_balance() RETURNS TRIGGER AS $$
DECLARE prev Decimal(16,2) := 0;
BEGIN
  -- Ambil saldo terakhir user tersebut sebelum insert ini
  SELECT COALESCE(MAX("balanceAfter"), 0) INTO prev
  FROM host_ledgers WHERE "hostId" = NEW."hostId" AND "createdAt" < NEW."createdAt";
  -- Validasi apakah balanceAfter yang dimasukkan sesuai logika matematika (prev + amount = new)
  IF ROUND((prev + NEW.amount)::numeric, 2) != NEW."balanceAfter" THEN
    RAISE EXCEPTION 'Invalid balanceAfter in HostLedger. Expected %, got %', (prev + NEW.amount), NEW."balanceAfter";
  END IF;
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;
CREATE TRIGGER trg_ledger_immutable
  BEFORE INSERT ON host_ledgers
  FOR EACH ROW EXECUTE FUNCTION enforce_ledger_balance();
-- =============================================
-- 5. TRIGGER: PAYOUT LIMIT CHECK
-- =============================================
DROP TRIGGER IF EXISTS trg_payout_limit ON payouts;
DROP FUNCTION IF EXISTS check_payout_limit;
CREATE OR REPLACE FUNCTION check_payout_limit() RETURNS TRIGGER AS $$
BEGIN
  -- Host tidak bisa request payout lebih besar dari saldo wallet saat ini
  IF NEW.amount > (SELECT "walletBalance" FROM users WHERE id = NEW."hostId") THEN
    RAISE EXCEPTION 'Payout amount exceeds wallet balance';
  END IF;
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;
CREATE TRIGGER trg_payout_limit
  BEFORE INSERT OR UPDATE ON payouts
  FOR EACH ROW EXECUTE FUNCTION check_payout_limit();
-- =============================================
-- 6. INDEX OPTIMIZATION (CRON JOBS)
-- =============================================
-- Partial index untuk mempercepat query cron job expired bookings
CREATE INDEX IF NOT EXISTS idx_bookings_expired_cron ON bookings("expiredAt")
WHERE status = 'PENDING' AND "isTest" = false AND "expiredAt" IS NOT NULL;
-- Index untuk mempermudah host melihat history payout terbaru
CREATE INDEX IF NOT EXISTS idx_payouts_host_latest ON payouts("hostId", "createdAt" DESC);
